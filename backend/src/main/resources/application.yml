spring:
  application:
    name: polyglot-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/polyglot}
    username: ${DB_USERNAME:polyglot}
    password: ${DB_PASSWORD:polyglot_dev}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  mvc:
    problemdetails:
      enabled: true
springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:true}
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
server:
  port: ${SERVER_PORT:8080}
app:
  cors:
    allowed-origin-patterns: "${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*}"
